- what: Municipality lattice by year, derived empirically
  how: Censo 2000 aggregate 1302 /localidades/N6 (5507); IBGE population estimates aggregate 6579, first year each code carries
    a non-sentinel value; Censo 2010 aggregate 2065 (5565); Censo 2022 aggregate 9514 (5570); IBGE localidades v1 /municipios
    (5571).
  url: https://servicodados.ibge.gov.br/api/v3/agregados
  retrieved: '2026-07-30'
- what: Parent (desmembrado de) relations
  how: IBGE Cidades 'Historico' page per municipality, Formacao Administrativa block where present, narrative Historico otherwise.
