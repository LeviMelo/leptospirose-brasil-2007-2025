# Municipalities that entered the IBGE lattice after the 2000 Census.
#
# Why this file exists
# --------------------
# Brazil's municipality lattice is not fixed. A leptospirosis case notified in
# 2005 under Santarem/PA covers territory that has been Mojui dos Campos/PA
# since 2013; comparing its 2005 and 2015 incidence at face value compares two
# different places. brepi.geo.lattice reads this file to date the lattice
# (load_municipalities), to state what is and is not resolvable across a
# boundary change (build_crosswalk), and to compute the merge sets that make a
# 2000-2022 panel comparable (amc_groups).
#
# What 'effective_year' means
# ---------------------------
# The first year the code appears in the IBGE lattice -- NOT the date of the
# state law, and not always the legal installation date. It was derived
# empirically: for each code, the first year IBGE's own population estimate
# series (SIDRA aggregate 6579) reports a non-sentinel value, cross-checked
# against the census lattices. Where the two disagree (Mesquita/RJ, Nazaria/PI)
# the IBGE lattice wins and the discrepancy is recorded in 'note', because the
# denominators this project joins against follow the lattice, not the statute.
#
# Cumulative counts implied by this file, all of which reconcile with IBGE:
#   2000: 5507   2001: 5560   2004: 5564   2010: 5565   2013: 5570   2025: 5571
#
# 'parents' lists every municipality that donated territory. A multi-parent
# entry is NOT accompanied by area shares: IBGE publishes the areas but the
# population and case shares are not recoverable from them, so any backward
# apportionment through such an entry is marked unresolvable rather than
# silently weighted.
#
# Do not edit by hand without updating 'source' and re-running
# brepi.geo.lattice.self_check().
schema: brepi.geo.municipality_changes/1
