[project]
name = "brepi"
version = "0.1.0"
description = "Reusable data core for Brazilian routine-health-data epidemiology (DATASUS, IBGE/SIDRA, climate, disasters)"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0", "pandas>=2.0", "numpy>=1.26", "scipy>=1.11", "pyarrow>=15",
  "httpx>=0.27", "pydantic>=2", "pyyaml", "typer", "rich", "loguru",
  "datasus-dbc", "dbfread", "duckdb", "geopandas", "shapely", "pyproj",
  "psutil>=5.9",
]

[project.optional-dependencies]
raster = ["rasterio", "rioxarray", "xarray", "netCDF4", "rasterstats"]
dev = ["pytest", "pytest-cov", "ruff"]
manuscript = ["python-docx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brepi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
